[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gripper-hl-host"
version = "0.1.0"
description = "Standalone 慧灵 Z-EFG-C65 gripper host — Web UI on hik-sensors gripper_huiling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "PyYAML>=6.0",
  "pydantic>=2.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
hardware = ["pyserial>=3.5"]
dev = ["pytest>=7.0"]

[project.scripts]
gripper-hl = "gripper_hl_app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gripper_hl_app = ["web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
